name: Release extension

# Publishes a GitHub release with a ready-to-install zip whenever the version in
# manifest.json has no release yet. To release: bump "version" in manifest.json
# and push this branch. Pushes that do not change the version do nothing.
on:
  push:
    branches:
      - claude/links-extension

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version and check for an existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(node -p "require('./manifest.json').version")"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "extension-v$ver" >/dev/null 2>&1; then
            echo "Release extension-v$ver already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.v.outputs.publish == 'true'
        run: npm test

      - name: Build zip
        if: steps.v.outputs.publish == 'true'
        run: |
          zip -r "lfc-tools-extension-${{ steps.v.outputs.ver }}.zip" \
            manifest.json background.js shared.js qr.js ui.js \
            popup.html popup.css popup.js \
            manage.html manage.css manage.js \
            options.html options.css options.js \
            theme.css icons fonts vendor INSTALL.txt

      - name: Publish release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.v.outputs.ver }}"
          gh release create "extension-v$ver" "lfc-tools-extension-$ver.zip" \
            --target "$GITHUB_SHA" \
            --title "LFC Tools $ver" \
            --notes "Download **lfc-tools-extension-$ver.zip**, unzip it, then follow INSTALL.txt (Load unpacked in chrome://extensions). It needs the matching Worker deployed from branch claude/links-worker (this version stores page titles, so redeploy the Worker if you have not since 0.2.0)."
