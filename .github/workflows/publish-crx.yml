name: Publish signed extension (Cloudflare Pages)

# On every published release: pack the extension into a signed CRX3, write update.xml
# (Chrome's gupdate format), deploy both to Cloudflare Pages, and check the live result.
#
# Triggers:
#   - release: published      a release someone published by hand.
#   - workflow_call           called by release.yml: releases created by that workflow use
#                             GITHUB_TOKEN, and GitHub does not start other workflows from
#                             events a GITHUB_TOKEN causes (only workflow_dispatch and
#                             repository_dispatch are exempt).
#   - workflow_dispatch       re-run for an existing release tag.
#
# Repository secrets: EXTENSION_PEM (the extension's private key, full .pem text),
# CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.
# Pages project: PAGES_PROJECT below; created on first run if it does not exist.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (for example extension-v0.5.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example extension-v0.5.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crx
  cancel-in-progress: false

env:
  PAGES_PROJECT: lfc-tools
  # Public address of the Pages site. manifest.json's update_url must be BASE_URL/update.xml.
  BASE_URL: https://lfc-tools.pages.dev
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        env:
          EXTENSION_PEM: ${{ secrets.EXTENSION_PEM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in EXTENSION_PEM CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set."; missing=1; fi
          done
          [ -z "${missing:-}" ]

      # 4. update_url in manifest.json must point at the hosted update.xml, or the build fails.
      - name: Check manifest update_url
        run: node scripts/check-release.mjs update-url "$BASE_URL/update.xml"

      - name: Check the signing key belongs to this extension
        env:
          EXTENSION_PEM: ${{ secrets.EXTENSION_PEM }}
        run: node scripts/check-release.mjs key

      - name: Test
        run: npm test

      # 1 + 2. Signed CRX3 and update.xml (gupdate: extension id, manifest version, https .crx URL).
      - name: Pack signed .crx and write update.xml
        env:
          EXTENSION_PEM: ${{ secrets.EXTENSION_PEM }}
        run: |
          ver="$(node -p "require('./manifest.json').version")"
          umask 077
          node scripts/check-release.mjs write-key "$RUNNER_TEMP/extension.pem"
          EXT_KEY_FILE="$RUNNER_TEMP/extension.pem" CHROME_BIN=google-chrome \
            scripts/pack-crx.sh "$BASE_URL/lfc-tools-$ver.crx" site
          rm -f "$RUNNER_TEMP/extension.pem"
          cp pages/_headers site/_headers
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          ls -l site
          cat site/update.xml

      # 3. Deploy both files to Cloudflare Pages.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.152.0 pages project create "$PAGES_PROJECT" --production-branch main || echo "Project exists (or could not be created); deploying."
          npx --yes wrangler@4.152.0 pages deploy site --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      # Prove what Chrome will actually see: status, content type, no nosniff, matching bytes.
      - name: Verify the live files
        run: |
          ver="$VERSION"
          crx="$BASE_URL/lfc-tools-$ver.crx"
          for attempt in $(seq 1 18); do
            code="$(curl -s -o live.xml -w '%{http_code}' "$BASE_URL/update.xml?cb=$RANDOM" || true)"
            if [ "$code" = "200" ] && grep -q "version=\"$ver\"" live.xml; then break; fi
            echo "Waiting for the deployment ($attempt/18, HTTP $code)..."; sleep 10
          done
          grep -q "version=\"$ver\"" live.xml || { echo "::error::$BASE_URL/update.xml does not show version $ver (is $BASE_URL the real address of the Pages project?)"; exit 1; }
          grep -q "codebase=\"$crx\"" live.xml || { echo "::error::update.xml does not point at $crx"; cat live.xml; exit 1; }
          curl -sS -D live.headers -o live.crx "$crx"
          cat live.headers
          head -n 1 live.headers | grep -q " 200" || { echo "::error::$crx did not return HTTP 200"; exit 1; }
          grep -i '^content-type:' live.headers | grep -qi 'application/x-chrome-extension' || { echo "::error::$crx is not served as application/x-chrome-extension"; exit 1; }
          if grep -qi '^x-content-type-options:' live.headers; then echo "::error::$crx is served with X-Content-Type-Options (nosniff)"; exit 1; fi
          cmp live.crx "site/lfc-tools-$ver.crx" || { echo "::error::The hosted .crx differs from the one packed here"; exit 1; }
          curl -sSI "$BASE_URL/update.xml" | grep -i '^x-content-type-options:' && { echo "::error::update.xml is served with nosniff"; exit 1; } || true
          echo "Live: $BASE_URL/update.xml -> $crx"
