<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LFC Tools: Links</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand"><img src="icons/icon48.png" alt=""><span>LFC Tools</span></div>
      <div class="top-actions">
        <button id="refresh" class="btn ghost" type="button"><span data-icon="refresh"></span>Refresh</button>
        <button id="settings" class="btn ghost" type="button"><span data-icon="settings"></span>Settings</button>
      </div>
    </header>

    <h1>Links</h1>

    <form id="create" class="card create" novalidate>
      <div class="field-group grow">
        <label for="new-url">Destination URL</label>
        <input id="new-url" type="url" placeholder="https://example.com/a/long/address" autocomplete="off" spellcheck="false">
      </div>
      <div class="field-group alias-col">
        <label for="new-alias">Custom alias <span class="muted">(optional)</span></label>
        <input id="new-alias" type="text" placeholder="e.g. spring-sale" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32">
      </div>
      <div class="field-group pin-col">
        <label for="new-pin">PIN lock <span class="muted">(optional)</span></label>
        <div class="pin-input-row">
          <input id="new-pin" type="text" inputmode="numeric" maxlength="6" placeholder="6 digits" autocomplete="off" spellcheck="false">
          <button id="new-pin-random" class="btn icon-only" type="button" title="Random PIN" aria-label="Random PIN"><span data-icon="shuffle"></span></button>
        </div>
      </div>
      <button id="create-btn" class="btn primary" type="submit"><span data-icon="plus"></span>Create link</button>
      <p id="create-msg" class="msg create-msg" role="status" aria-live="polite"></p>
    </form>

    <div class="toolbar">
      <div class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search links (press / to focus)" aria-label="Search links" autocomplete="off">
      </div>
      <select id="sort" aria-label="Sort links">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="alias">Alias A to Z</option>
      </select>
      <select id="lock-filter" aria-label="Filter by PIN lock">
        <option value="all">All links</option>
        <option value="locked">Locked with a PIN</option>
        <option value="unlocked">Not locked</option>
      </select>
      <span id="count" class="muted count"></span>
      <span class="spacer"></span>
      <button id="bulk-delete" class="btn danger small" type="button" hidden><span data-icon="trash"></span><span id="bulk-label">Delete selected</span></button>
      <button id="export" class="btn small" type="button"><span data-icon="download"></span>Export CSV</button>
    </div>

    <div id="error" class="card error" role="alert" hidden>
      <p id="error-text"></p>
      <div class="error-actions">
        <button id="retry" class="btn" type="button">Try again</button>
        <button id="error-settings" class="btn" type="button">Open settings</button>
      </div>
    </div>

    <div id="table-wrap" class="table-wrap">
      <table id="table">
        <thead>
          <tr>
            <th class="sel"><input id="select-all" type="checkbox" aria-label="Select all links shown"></th>
            <th>Short link</th>
            <th>Destination</th>
            <th>Created</th>
            <th id="by-head" hidden>Created by</th>
            <th class="actions-head"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>
        <h2 id="empty-title">No links yet</h2>
        <p id="empty-text" class="muted">Create one above, or click the LFC Tools icon on any page.</p>
      </div>
    </div>
  </div>

  <dialog id="edit-dialog">
    <form id="edit-form" class="dialog-body" novalidate>
      <h2>Edit link</h2>
      <div class="field-group">
        <label for="edit-alias">Short link</label>
        <div class="prefixed"><span id="edit-prefix" class="muted"></span><input id="edit-alias" type="text" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="field-group">
        <label for="edit-url">Destination URL</label>
        <input id="edit-url" type="url" autocomplete="off" spellcheck="false">
      </div>
      <div class="field-group">
        <label for="edit-title">Title <span class="muted">(optional)</span></label>
        <input id="edit-title" type="text" maxlength="140" autocomplete="off">
      </div>
      <p id="edit-msg" class="msg" role="alert"></p>
      <div class="dialog-actions">
        <button id="edit-cancel" class="btn" type="button">Cancel</button>
        <button id="edit-save" class="btn primary" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="pin-dialog">
    <form id="pin-dialog-form" class="dialog-body" novalidate>
      <h2 id="pin-dialog-title">PIN lock</h2>
      <p id="pin-dialog-state" class="muted"></p>
      <div id="pin-dialog-fields" class="field-group">
        <label for="pin-dialog-input" id="pin-dialog-label">6-digit PIN</label>
        <div class="pin-input-row">
          <input id="pin-dialog-input" type="text" inputmode="numeric" maxlength="6" autocomplete="off" spellcheck="false" placeholder="123456">
          <button id="pin-dialog-random" class="btn" type="button"><span data-icon="shuffle"></span>Random</button>
        </div>
      </div>
      <div id="pin-dialog-done" class="pin-done" hidden>
        <p>PIN: <strong id="pin-dialog-shown" class="pin-shown"></strong></p>
        <p class="muted">Save it now. It can't be shown again.</p>
        <button id="pin-dialog-copy" class="btn small" type="button"><span data-icon="copy"></span>Copy link + PIN</button>
      </div>
      <p id="pin-dialog-msg" class="msg" role="alert"></p>
      <div class="dialog-actions between">
        <button id="pin-dialog-remove" class="btn danger" type="button" hidden>Remove lock</button>
        <span class="row">
          <button id="pin-dialog-close" class="btn" type="button">Close</button>
          <button id="pin-dialog-save" class="btn primary" type="submit">Lock link</button>
        </span>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog">
    <div class="dialog-body">
      <h2 id="delete-title">Delete link?</h2>
      <p id="delete-text" class="muted"></p>
      <p id="delete-msg" class="msg" role="alert"></p>
      <div class="dialog-actions">
        <button id="delete-cancel" class="btn" type="button">Cancel</button>
        <button id="delete-confirm" class="btn danger" type="button">Delete</button>
      </div>
    </div>
  </dialog>

  <dialog id="qr-dialog">
    <div class="dialog-body qr-body">
      <h2 id="qr-title">QR code</h2>
      <div class="qr-big"><canvas id="qr-canvas" width="256" height="256" role="img" aria-label="QR code"></canvas></div>
      <p id="qr-url" class="qr-url"></p>
      <div class="dialog-actions between">
        <button id="qr-close" class="btn" type="button">Close</button>
        <span class="row">
          <button id="qr-png" class="btn" type="button"><span data-icon="download"></span>Save PNG</button>
          <button id="qr-svg" class="btn" type="button"><span data-icon="download"></span>Save SVG</button>
        </span>
      </div>
    </div>
  </dialog>

  <script type="module" src="manage.js"></script>
</body>
</html>
