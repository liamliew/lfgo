<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LFC Tools</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="brand"><img src="icons/icon48.png" alt=""><span>LFC Tools</span></div>
      <div class="top-actions">
        <button id="manage" class="icon-btn" type="button" title="Manage all links" aria-label="Manage all links"><span data-icon="list"></span></button>
        <button id="settings" class="icon-btn" type="button" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button>
      </div>
    </header>

    <section id="setup" class="card" hidden>
      <h2 id="setup-title">Sign in to LFC Tools</h2>
      <p id="setup-text" class="muted"></p>
      <button id="google-btn" class="btn google" type="button"><span data-icon="google"></span>Sign in with Google</button>
      <p id="setup-msg" class="msg" role="status" aria-live="polite"></p>
      <button id="setup-btn" class="link-btn" type="button">Use an API key instead</button>
    </section>

    <section id="blocked" class="card" hidden>
      <p id="blocked-text"></p>
    </section>

    <section id="failed" class="card" hidden>
      <p id="failed-text" class="msg err" role="alert"></p>
      <button id="retry" class="btn" type="button">Try again</button>
    </section>

    <section id="ready" hidden>
      <label for="alias" class="field-label">Short link</label>
      <div class="field">
        <span id="prefix" class="prefix"></span>
        <input id="alias" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="32" aria-describedby="status">
        <button id="copy" class="icon-btn" type="button" title="Copy short link" aria-label="Copy short link"><span data-icon="copy"></span></button>
      </div>
      <p id="status" class="msg" role="status" aria-live="polite"></p>
      <button id="save" class="btn primary block" type="button" hidden>Save alias</button>

      <div id="pin-box" class="pin-box">
        <div id="pin-locked" class="pin-row" hidden>
          <span class="chip"><span data-icon="lock"></span>Locked with a PIN</span>
          <span class="pin-links">
            <button id="pin-change" class="link-btn" type="button">Change</button>
            <button id="pin-remove" class="link-btn danger" type="button">Remove</button>
          </span>
        </div>
        <button id="pin-open" class="btn small" type="button"><span data-icon="lock"></span>Lock with a PIN</button>
        <form id="pin-form" class="pin-form" hidden novalidate>
          <label for="pin-input" class="field-label">6-digit PIN</label>
          <div class="pin-input-row">
            <input id="pin-input" type="text" inputmode="numeric" maxlength="6" autocomplete="off" spellcheck="false" placeholder="123456">
            <button id="pin-random" class="btn small" type="button" title="Generate a random PIN"><span data-icon="shuffle"></span>Random</button>
          </div>
          <div class="pin-actions">
            <button id="pin-save" class="btn primary small" type="submit">Lock link</button>
            <button id="pin-cancel" class="btn small ghost" type="button">Cancel</button>
          </div>
        </form>
        <div id="pin-done" class="pin-done" hidden>
          <p>PIN: <strong id="pin-shown" class="pin-shown"></strong></p>
          <p class="muted">Save it now. It can't be shown again.</p>
          <button id="pin-copy-both" class="btn small" type="button"><span data-icon="copy"></span>Copy link + PIN</button>
        </div>
      </div>

      <div class="qr-card card">
        <div id="qr-frame" class="qr-frame skeleton"><canvas id="qr" width="144" height="144" aria-label="QR code for the short link" role="img"></canvas></div>
        <div class="qr-side">
          <p class="qr-title">QR code</p>
          <p class="muted qr-hint">Scan to open the link</p>
          <div class="qr-actions">
            <button id="qr-png" class="btn small" type="button"><span data-icon="download"></span>PNG</button>
            <button id="qr-svg" class="btn small" type="button"><span data-icon="download"></span>SVG</button>
          </div>
        </div>
      </div>

      <div class="dest">
        <p id="dest-title" class="dest-title"></p>
        <p id="dest-url" class="dest-url muted"></p>
      </div>
    </section>

    <section id="recent" class="recent" hidden>
      <div class="recent-head">
        <h2>Recent links</h2>
        <a id="see-all" href="#">See all</a>
      </div>
      <ul id="recent-list" class="recent-list"></ul>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
